services:
  database:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employeedb

    ports: 
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend

    container_name: backend
    environment: 
      DATABASE_URL: postgresql://postgres:postgres@database:5432/employeedb

    ports:
      - "8000:8000"

    depends_on: 
      - database

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000

    container_name: frontend
    ports:
      - "82:80"
    
    depends_on: 
      - backend
    
    restart: unless-stopped


volumes:
  postgres-data:

   
  